server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # /catalog/ is a real directory, so it resolves before the SPA fallback runs
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # A `types` block REPLACES the inherited map rather than extending it, which
    # would have served every file as application/octet-stream. Declare the one
    # missing type per-location instead and leave mime.types alone.
    location ~* \.glb$ {
        default_type model/gltf-binary;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Vite fingerprints what it emits and writes it flat into /assets/ (index-DUQX4_n-.js),
    # so those names change whenever the contents do — safe to cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";

        # Anything in a sub-folder was copied from public/assets/ under its original name —
        # SmartGift plates, mockups, 3D models, videos. A rebuild can change it at the same URL,
        # so it must not be immutable. ^~ above also keeps the server-level .glb location from
        # ever running, which is why the model MIME type is declared here.
        location ~ ^/assets/.+/ {
            expires 30d;
            add_header Cache-Control "public, no-transform";

            location ~* \.glb$ {
                default_type model/gltf-binary;
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
        }
    }

    # The catalog keeps stable filenames: customer-catalog.js and the JSON under
    # data/ are rewritten in place by each pipeline run, so caching them for a
    # year would pin visitors to a stale catalog. Its artwork can still be held.
    location ^~ /catalog/assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /catalog/ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(png|jpe?g|gif|ico|svg|webp|mp4|webm|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
